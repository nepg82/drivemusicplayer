<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive Music Player</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#121212; color:#eee;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px; border-bottom:1px solid #2a2a2a; display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:18px; margin:0; }
  #signin { background:#1db954; color:#000; border:none; padding:8px 14px; border-radius:20px; font-weight:600; cursor:pointer; }
  #status { padding:8px 16px; color:#888; font-size:13px; }
  #progress { height:3px; background:#2a2a2a; overflow:hidden; display:none; }
  #progress.on { display:block; }
  #progress::before { content:""; display:block; height:100%; width:30%; background:#1db954; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-100%); } 100% { transform:translateX(400%); } }
  #signin:disabled { opacity:.5; cursor:default; }
  #crumbs { padding:4px 16px; font-size:13px; color:#aaa; display:flex; gap:8px; align-items:center; }
  #crumbs button { background:#2a2a2a; color:#eee; border:none; border-radius:12px; padding:4px 10px; cursor:pointer; }
  main { flex:1; min-height:0; overflow-y:auto; padding:4px 0; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 16px; cursor:pointer; font-size:14px; }
  .row:hover, .row.active { background:#1e1e1e; }
  .row.active { color:#1ed760; }
  .row span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row small { color:#777; }
  footer { border-top:1px solid #2a2a2a; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); background:#181818; }
  #nowplaying { font-size:13px; color:#aaa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
  #seekrow { display:flex; align-items:center; gap:8px; font-size:11px; color:#888; margin:6px 0; }
  #seek { flex:1; accent-color:#1db954; }
  #controls { display:flex; justify-content:center; gap:20px; }
  button.ctrl { background:none; border:none; color:#eee; font-size:22px; cursor:pointer; padding:2px 8px; }
</style>
</head>
<body>

<header>
  <h1><span id="reset" title="Reset app: unregister service worker, clear caches, reload" style="cursor:pointer">🎵</span> Drive Music</h1>
  <button id="signin">Sign in with Google</button>
</header>
<div id="status">Sign in to load your audio files from Google Drive.</div>
<div id="progress"></div>
<div id="crumbs"></div>
<main id="list"></main>

<footer>
  <div id="nowplaying">Nothing playing</div>
  <div id="seekrow">
    <span id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <span id="dur">0:00</span>
  </div>
  <div id="controls">
    <button class="ctrl" id="prev">⏮</button>
    <button class="ctrl" id="playpause">▶️</button>
    <button class="ctrl" id="next">⏭</button>
  </div>
</footer>

<audio id="player"></audio>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script>
// CLIENT_ID comes from config.js

const API = "https://www.googleapis.com/drive/v3";
const SCOPE = "https://www.googleapis.com/auth/drive.readonly";
const AUDIO_EXT = /\.(mp3|m4a|aac|flac|wav|ogg|oga|opus|weba)$/i;
const OTHER = "__other";

const $ = (id) => document.getElementById(id);
const player = $("player"), statusEl = $("status"), listEl = $("list"), crumbsEl = $("crumbs");
const seek = $("seek"), playPauseBtn = $("playpause");

let tokenClient, accessToken = null, tokenExpiry = 0, pendingToken = null;
let rootId, folders = {}, path = [];
let queue = [], currentId = null;

/* ---------- Tiny IndexedDB key/value cache ---------- */
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open("drive-music", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function kvGet(k) {
  try {
    const db = await openDB();
    return await new Promise((res) => {
      const q = db.transaction("kv").objectStore("kv").get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => res(undefined);
    });
  } catch { return undefined; }
}
async function kvSet(k, v) {
  try { (await openDB()).transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch {}
}

/* ---------- Auth (with refresh) ---------- */
function requestToken(prompt) {
  return new Promise((resolve, reject) => {
    tokenClient.callback = (r) => {
      if (r.error) return reject(new Error(r.error));
      accessToken = r.access_token;
      tokenExpiry = Date.now() + (r.expires_in - 60) * 1000; // refresh a minute early
      resolve(accessToken);
    };
    tokenClient.error_callback = (e) => reject(new Error(e.type || "auth_error"));
    tokenClient.requestAccessToken({ prompt });
  });
}
function getToken(force = false) {
  if (!force && accessToken && Date.now() < tokenExpiry) return Promise.resolve(accessToken);
  if (!pendingToken) pendingToken = requestToken("").finally(() => (pendingToken = null));
  return pendingToken;
}
async function driveFetch(url) {
  let res = await fetch(url, { headers: { Authorization: `Bearer ${await getToken()}` } });
  if (res.status === 401) {
    res = await fetch(url, { headers: { Authorization: `Bearer ${await getToken(true)}` } });
  }
  if (!res.ok) throw new Error(`Drive API error ${res.status}: ${await res.text()}`);
  return res;
}

window.addEventListener("load", async () => {
  const cached = await kvGet("library");
  if (cached) {
    rootId = cached.rootId; buildLibrary(cached.all); path = [rootId]; render();
    statusEl.textContent = `Saved library from ${new Date(cached.savedAt).toLocaleString()}. Sign in to refresh.`;
  }
  if (typeof CLIENT_ID === "undefined" || !/^\d+-[\w-]+\.apps\.googleusercontent\.com$/.test(CLIENT_ID)) {
    statusEl.textContent = "Check config.js: CLIENT_ID is missing or malformed (stray characters or leftover placeholder?).";
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPE, callback: () => {} });
});
$("signin").addEventListener("click", async () => {
  try { await getToken(); await loadLibrary(); }
  catch (e) { statusEl.textContent = "Sign-in failed: " + e.message; }
});

/* ---------- Library / folders ---------- */
async function loadLibrary() {
  statusEl.textContent = "Connecting to Drive...";
  $("progress").classList.add("on"); $("signin").disabled = true;
  try {
    rootId = (await (await driveFetch(`${API}/files/root?fields=id`)).json()).id;
    const q = encodeURIComponent("(mimeType contains 'audio/' or mimeType='application/vnd.google-apps.folder') and trashed=false");
    let all = [], pageToken = "";
    do {
      const url = `${API}/files?q=${q}&fields=nextPageToken,files(id,name,mimeType,parents)&pageSize=1000` +
                  (pageToken ? `&pageToken=${pageToken}` : "");
      const data = await (await driveFetch(url)).json();
      all = all.concat(data.files || []);
      statusEl.textContent = `Fetching your library... ${all.length.toLocaleString()} items found`;
      pageToken = data.nextPageToken || "";
    } while (pageToken);

    statusEl.textContent = "Building folders...";
    await kvSet("library", { rootId, all, savedAt: Date.now() });
    const keep = path.slice();
    buildLibrary(all);
    path = keep.length && keep.every((id) => folders[id]) ? keep : [rootId];
    statusEl.textContent = "";
    render();
    $("signin").textContent = "↻ Refresh";
  } catch (e) { statusEl.textContent = "Error loading library: " + e.message; }
  finally { $("progress").classList.remove("on"); $("signin").disabled = false; }
}

function buildLibrary(all) {
    folders = {
      [rootId]: { id: rootId, name: "My Drive", kids: [], files: [] },
      [OTHER]: { id: OTHER, name: "Shared / other", kids: [], files: [] },
    };
    const isFolder = (f) => f.mimeType === "application/vnd.google-apps.folder";
    all.filter(isFolder).forEach((f) => (folders[f.id] = { id: f.id, name: f.name, parent: (f.parents || [])[0], kids: [], files: [] }));
    const home = (p) => (folders[p] ? p : OTHER);
    all.filter(isFolder).forEach((f) => folders[home(folders[f.id].parent)].kids.push(f.id));
    all.filter((f) => !isFolder(f) && AUDIO_EXT.test(f.name)).forEach((f) => folders[home((f.parents || [])[0])].files.push(f));
    if (count(OTHER) > 0) folders[rootId].kids.push(OTHER);
}
function count(id, seen = new Set()) {
  if (seen.has(id)) return 0; seen.add(id);
  const f = folders[id];
  return f.files.length + f.kids.reduce((n, k) => n + count(k, seen), 0);
}
const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true });

function render() {
  const cur = folders[path[path.length - 1]];
  crumbsEl.innerHTML = "";
  if (path.length > 1) {
    const b = document.createElement("button"); b.textContent = "← Back";
    b.onclick = () => { path.pop(); render(); }; crumbsEl.appendChild(b);
  }
  const t = document.createElement("span"); t.textContent = path.map((id) => folders[id].name).join(" / ");
  crumbsEl.appendChild(t);

  listEl.innerHTML = "";
  cur.kids.map((id) => folders[id]).filter((f) => count(f.id) > 0).sort(byName).forEach((f) => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span>📁 ${esc(f.name)}</span><small>${count(f.id)}</small>`;
    row.onclick = () => { path.push(f.id); render(); };
    listEl.appendChild(row);
  });
  [...cur.files].sort(byName).forEach((f) => {
    const row = document.createElement("div");
    row.className = "row" + (f.id === currentId ? " active" : ""); row.dataset.id = f.id;
    row.innerHTML = `<span>${esc(f.name)}</span>`;
    row.onclick = () => { queue = [...cur.files].sort(byName); playTrack(f); };
    listEl.appendChild(row);
  });
  if (!listEl.children.length) statusEl.textContent = "No audio in this folder.";
  else if (statusEl.textContent === "No audio in this folder.") statusEl.textContent = "";
}
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------- Playback ---------- */
async function playTrack(f) {
  currentId = f.id;
  document.querySelectorAll(".row").forEach((r) => r.classList.toggle("active", r.dataset.id === f.id));
  $("nowplaying").textContent = f.name;
  try {
    await getToken(); // may show a Google popup if signed out / expired; runs right after your tap
    if (navigator.serviceWorker.controller) {
      // Streamed through the service worker (supports range requests / seeking)
      const type = f.mimeType && f.mimeType.startsWith("audio/") ? f.mimeType : "audio/mpeg";
      player.src = `drive-stream/${f.id}?type=${encodeURIComponent(type)}`;
    } else {
      // Fallback: download whole file as a blob
      $("nowplaying").textContent = "Loading: " + f.name;
      const blob = await (await driveFetch(`${API}/files/${f.id}?alt=media`)).blob();
      player.src = URL.createObjectURL(blob);
      $("nowplaying").textContent = f.name;
    }
    await player.play();
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: f.name });
  } catch (e) { $("nowplaying").textContent = "Error: " + e.message; }
}
function step(d) {
  const i = queue.findIndex((f) => f.id === currentId);
  if (i >= 0 && queue[i + d]) playTrack(queue[i + d]);
}
const fmt = (s) => (isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00");

playPauseBtn.onclick = () => (player.paused ? player.play() : player.pause());
$("next").onclick = () => step(1);
$("prev").onclick = () => step(-1);
player.addEventListener("play", () => (playPauseBtn.textContent = "⏸"));
player.addEventListener("pause", () => (playPauseBtn.textContent = "▶️"));
player.addEventListener("ended", () => step(1));
player.addEventListener("error", () => {
  const c = player.error ? player.error.code : "?";
  $("nowplaying").textContent = `Playback error (code ${c}): ${player.error && player.error.message || "unknown"}`;
});

let scrubbing = false;
seek.addEventListener("input", () => { scrubbing = true; $("cur").textContent = fmt((seek.value / 1000) * player.duration); });
seek.addEventListener("change", () => { player.currentTime = (seek.value / 1000) * player.duration; scrubbing = false; });
player.addEventListener("timeupdate", () => {
  $("dur").textContent = fmt(player.duration);
  if (scrubbing || !isFinite(player.duration)) return;
  $("cur").textContent = fmt(player.currentTime);
  seek.value = (player.currentTime / player.duration) * 1000;
  if ("mediaSession" in navigator && navigator.mediaSession.setPositionState)
    navigator.mediaSession.setPositionState({ duration: player.duration, position: player.currentTime, playbackRate: player.playbackRate });
});
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler("play", () => player.play());
  ms.setActionHandler("pause", () => player.pause());
  ms.setActionHandler("previoustrack", () => step(-1));
  ms.setActionHandler("nexttrack", () => step(1));
  ms.setActionHandler("seekto", (d) => (player.currentTime = d.seekTime));
}

/* ---------- Service worker killer (tap the 🎵) ---------- */
$("reset").addEventListener("click", async () => {
  if (!confirm("Reset app? This unregisters the service worker, clears app caches, and reloads.")) return;
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((r) => r.unregister()));
    await Promise.all((await caches.keys()).map((k) => caches.delete(k)));
  } catch {}
  location.reload();
});

/* ---------- Service worker ---------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // The service worker asks us for a (fresh) token whenever it streams from Drive
  navigator.serviceWorker.addEventListener("message", async (e) => {
    if (e.data && e.data.type === "need-token") {
      try { e.ports[0].postMessage(await getToken()); } catch { e.ports[0].postMessage(null); }
    }
  });
}
</script>
</body>
</html>
